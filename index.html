<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F8FAFC">
  <title>Dumpy — Mobile Screenshot Inbox</title>
  
  <!-- DM Sans Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>

  <div class="app-wrapper">
    <!-- Header: Brand Logo + Clean Room Code (No "Room" or "ID" text) -->
    <header class="app-header">
      <div class="brand-wrap">
        <div class="brand-icon">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </div>
        <span class="brand-title">Dumpy</span>
      </div>

      <!-- Clean Room Code Badge (Just the code with live dot & copy icon) -->
      <div class="room-code-tag" id="roomCodeDisplay" title="Tap to copy pairing code" role="button" tabindex="0">
        <span class="live-dot"></span>
        <span class="room-code-val" id="roomCodeText">DMP-........</span>
        <svg class="icon copy-icon" viewBox="0 0 24 24">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
        </svg>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Creative Minimal Empty State / Interactive Drop Area -->
      <div class="empty-dropzone" id="uploadCard" role="button" tabindex="0" title="Tap to select photos or drop files">
        <div class="creative-art">
          <div class="art-card art-card-back">
            <div class="art-line art-line-1"></div>
            <div class="art-line art-line-2"></div>
          </div>
          <div class="art-card art-card-front">
            <div class="art-image-icon">
              <svg class="icon" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            </div>
            <div class="art-badge">
              <svg class="icon badge-icon" viewBox="0 0 24 24">
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
            </div>
          </div>
        </div>
        <div class="empty-copy">
          <div class="empty-headline" id="dropzoneTitle">Drop screenshots here</div>
          <p class="empty-subtext">Tap anywhere to browse or use the buttons below to beam photos to Figma</p>
        </div>
      </div>

      <!-- Live Upload Activity Feed -->
      <section class="activity-section" id="queueSection" style="display: none;">
        <div class="activity-header">
          <div class="activity-title-group">
            <span class="activity-title">Upload Activity</span>
            <span class="activity-count-badge" id="queueCountBadge">0 files</span>
          </div>
          <button class="btn-clear-activity" id="btnClearQueue" title="Clear finished activity">
            <svg class="icon" viewBox="0 0 24 24">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
            <span>Clear</span>
          </button>
        </div>

        <div class="activity-list" id="queueList"></div>
      </section>
    </main>

    <!-- Bottom Floating Action Bar (Solid Colors) -->
    <footer class="bottom-fab-bar">
      <div class="fab-grid">
        <!-- Take Photo FAB -->
        <button class="fab-btn fab-camera" id="btnCamera" type="button">
          <div class="fab-icon-wrap">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </div>
          <span class="fab-label">Take Photo</span>
        </button>

        <!-- Upload from Gallery FAB -->
        <button class="fab-btn fab-gallery" id="btnGallery" type="button">
          <div class="fab-icon-wrap">
            <svg class="icon" viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
          <span class="fab-label">Upload Gallery</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- Dedicated Off-DOM Hidden File Inputs -->
  <div style="display: none; visibility: hidden; position: fixed; pointer-events: none; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
    <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif,image/heic,image/heif,image/svg+xml,image/*" multiple />
    <input type="file" id="cameraInput" accept="image/*" capture="environment" />
  </div>

  <!-- Toast Notification -->
  <div class="toast-bar" id="toastBar">
    <svg class="icon" style="color: var(--success);" viewBox="0 0 24 24">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    <span id="toastText">Delivered to Figma</span>
  </div>

  <script src="/web/config.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>

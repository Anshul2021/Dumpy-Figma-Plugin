<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F8FAFC">
  <title>Dumpy — Real-Time Mobile Screenshot Inbox</title>
  
  <!-- DM Sans Typography exclusively -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>

  <div class="app-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-wrap">
        <div class="brand-icon">
          <svg class="icon" style="width: 20px; height: 20px;" viewBox="0 0 24 24">
            <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </div>
        <span class="brand-title">Dumpy</span>
      </div>

      <div class="header-controls">
        <!-- Auth Profile Pill or Sign-in button -->
        <div id="authContainer">
          <button class="btn-google-auth" id="btnGoogleAuth" title="Sign in with Google">
            <svg class="google-icon" viewBox="0 0 24 24" width="16" height="16">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.36 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
            <span>Sign in</span>
          </button>
          <div class="user-profile-pill" id="userProfilePill" style="display: none;">
            <img src="" class="user-avatar" id="userAvatar" alt="User" />
            <span class="user-name" id="userName">User</span>
            <button class="btn-signout" id="btnSignOut" title="Sign Out">✕</button>
          </div>
        </div>

        <button class="btn-icon" id="btnSettings" title="Supabase Credentials" aria-label="Settings">
          <svg class="icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Room Status Card & QR Code -->
    <div class="room-banner" id="roomBanner">
      <div class="room-details">
        <span class="room-caption">
          <span class="live-badge">
            <span class="live-dot"></span>
            Paired Room
          </span>
        </span>
        <span class="room-code-value" id="roomCodeDisplay" title="Click to copy Room Code">DMP-.....</span>
      </div>
      <div class="room-banner-actions">
        <button class="btn-qr-toggle" id="btnToggleQR" title="Show/Hide QR Code">
          <svg class="icon" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          <span>QR Code</span>
        </button>
        <button class="btn-change-room" id="btnChangeRoom">Switch Room</button>
      </div>
    </div>

    <!-- Collapsible QR Code Card for pairing phones -->
    <div class="qr-pairing-card" id="webQRCard" style="display: none;">
      <div class="qr-canvas-wrapper" id="webQrContainer">
        <canvas id="webQrCanvas" width="160" height="160"></canvas>
      </div>
      <div class="qr-pairing-meta">
        <div class="qr-pairing-title">Scan to Pair Mobile</div>
        <p class="qr-pairing-desc">Point your phone camera here to upload screenshots directly to this room.</p>
        <button class="btn-secondary-sm" id="btnCopyWebLink">
          <svg class="icon" viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
          Copy Pairing Link
        </button>
      </div>
    </div>

    <!-- Main Dropzone / Tap Area -->
    <div class="upload-card" id="uploadCard" role="button" tabindex="0">
      <input type="file" id="fileInput" class="hidden-input" accept="image/*" multiple />
      <div class="upload-icon-halo">
        <svg class="icon" style="width: 32px; height: 32px;" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <div class="upload-instructions">
        <div class="upload-title">Drop or Select Screenshots</div>
        <div class="upload-subtitle">Beam multiple photos straight to Figma</div>
      </div>
      <button class="btn-shutter" id="btnUploadShutter" type="button">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Upload Photos
      </button>
    </div>

    <!-- Quick Camera & Photo Roll Buttons -->
    <div class="quick-options">
      <input type="file" id="cameraInput" class="hidden-input" accept="image/*" capture="environment" />
      <button class="quick-btn" id="btnCamera" type="button">
        <div class="quick-btn-icon">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
        Take Photo
      </button>

      <button class="quick-btn" id="btnGallery" type="button">
        <div class="quick-btn-icon">
          <svg class="icon" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>
        Photo Library
      </button>
    </div>

    <!-- Live Upload Queue -->
    <div class="queue-container" id="queueSection" style="display: none;">
      <div class="section-title">
        <span>Upload Activity</span>
      </div>
      <div class="queue-list" id="queueList"></div>
    </div>
  </div>

  <!-- Room Switching Modal -->
  <div class="modal-overlay" id="roomModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Switch Pairing Room</div>
        <button class="btn-icon" id="btnCloseRoomModal">
          <svg class="icon" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="inputRoomCode">Room Code (e.g. DMP-8X9K)</label>
          <input type="text" class="form-input" id="inputRoomCode" placeholder="Enter Room Code" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-submit" id="btnSaveRoom">Connect</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Supabase Backend</div>
        <button class="btn-icon" id="btnCloseSettings">
          <svg class="icon" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="inputSupabaseUrl">Supabase Project URL</label>
          <input type="text" class="form-input" id="inputSupabaseUrl" placeholder="https://nivrnksfmkskmjdjzvzb.supabase.co" />
        </div>
        <div class="form-group">
          <label class="form-label" for="inputSupabaseKey">Supabase Anon Key</label>
          <input type="password" class="form-input" id="inputSupabaseKey" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6..." />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-submit" id="btnSaveSettings">Save</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-bar" id="toastBar">
    <svg class="icon" style="color: var(--success);" viewBox="0 0 24 24">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    <span id="toastText">Uploaded successfully</span>
  </div>

  <script src="/web/config.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>

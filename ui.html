<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dumpy — Real-Time Screenshot Inbox</title>
  
  <!-- DM Sans Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Clean Figma Native / Sapphire Surface Palette */
      --bg-page: #FFFFFF;
      --bg-surface: #FFFFFF;
      --bg-surface-hover: #F8FAFC;
      --bg-subtle: #F1F5F9;
      --bg-accent-subtle: #EFF6FF;
      
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --primary-gradient: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      --primary-light: #EFF6FF;
      --primary-border: #BFDBFE;
      --primary-glow: rgba(37, 99, 235, 0.2);
      
      --success: #059669;
      --success-bg: #ECFDF5;
      --success-border: #A7F3D0;
      
      --danger: #DC2626;
      --danger-bg: #FEF2F2;
      --danger-border: #FECACA;
      
      --text-main: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      
      --border: #E2E8F0;
      --border-light: #F1F5F9;
      --border-focus: #3B82F6;
      
      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
      --shadow-md: 0 8px 20px -3px rgba(15, 23, 42, 0.08);
      --shadow-primary: 0 4px 14px rgba(37, 99, 235, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-size: 13px;
      line-height: 1.45;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    /* Top App Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      box-shadow: 0 2px 6px var(--primary-glow);
    }
    .logo-badge .icon {
      width: 15px;
      height: 15px;
    }

    .brand-text {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.3px;
      color: var(--text-main);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      font-size: 10px;
      font-weight: 600;
      color: var(--success);
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px rgba(5, 150, 105, 0.4);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Main Scrollable Surface */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 1. Centered Pairing Section (On Surface) */
    .pairing-surface {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      padding: 6px 0 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .qr-frame {
      width: 136px;
      height: 136px;
      background: #FFFFFF;
      padding: 5px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }
    .qr-frame:hover {
      transform: scale(1.02);
      box-shadow: var(--shadow-md);
      border-color: var(--primary-border);
    }
    .qr-frame svg, .qr-frame img {
      width: 100% !important;
      height: 100% !important;
      display: block;
      object-fit: contain;
    }

    .room-code-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .room-code-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--primary-border);
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.15s ease;
    }
    .room-code-badge:hover {
      background: #DBEAFE;
    }
    .room-code-badge:active {
      transform: scale(0.96);
    }

    .copy-icon {
      width: 12px;
      height: 12px;
      stroke: var(--primary);
      opacity: 0.75;
    }

    .icon-btn-subtle {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      width: 26px;
      height: 26px;
      border-radius: var(--radius-xs);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-xs);
    }
    .icon-btn-subtle:hover {
      background: var(--bg-surface-hover);
      color: var(--text-main);
      border-color: #CBD5E1;
    }
    .icon-btn-subtle:active {
      transform: scale(0.94);
    }

    .pairing-caption {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* 2. Destination Section Row (Surface Level) */
    .section-surface-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .surface-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .select-wrapper {
      position: relative;
      display: flex;
      width: 100%;
    }

    .custom-select {
      width: 100%;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 7px 28px 7px 10px;
      border-radius: var(--radius-xs);
      font-size: 12px;
      font-weight: 500;
      outline: none;
      appearance: none;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .custom-select:focus {
      border-color: var(--primary);
      background: #FFFFFF;
    }

    .select-chevron {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-muted);
      width: 14px;
      height: 14px;
    }

    .new-section-row {
      display: none;
      gap: 6px;
    }
    .new-section-row.active {
      display: flex;
    }

    .text-input {
      flex: 1;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 7px 10px;
      border-radius: var(--radius-xs);
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .text-input:focus {
      border-color: var(--primary);
      background: #FFFFFF;
    }

    /* 3. Live Inbox Section (Surface Level) */
    .inbox-surface-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .inbox-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 0;
    }

    .inbox-title-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .inbox-heading {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.2px;
    }

    .count-pill {
      background: var(--primary-light);
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      border: 1px solid var(--primary-border);
    }

    .inbox-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .checkbox-custom {
      appearance: none;
      width: 14px;
      height: 14px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      outline: none;
      transition: all 0.15s ease;
    }
    .checkbox-custom:checked {
      background: var(--primary);
      border-color: var(--primary);
    }
    .checkbox-custom:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 4px;
      height: 8px;
      border: solid white;
      border-width: 0 1.5px 1.5px 0;
      transform: rotate(45deg);
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      width: 24px;
      height: 24px;
      border-radius: var(--radius-xs);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .icon-btn:hover {
      background: var(--bg-surface-hover);
      color: var(--text-main);
    }

    /* Inbox List & Items */
    .inbox-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .empty-state {
      padding: 24px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .empty-icon-wrap {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .empty-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .empty-sub {
      font-size: 11px;
      color: var(--text-muted);
      max-width: 240px;
      line-height: 1.35;
    }

    /* Screenshot Item Row */
    .item-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
      position: relative;
    }
    .item-row:hover {
      border-color: #CBD5E1;
      background: var(--bg-surface-hover);
    }
    .item-row.selected {
      border-color: var(--primary-border);
      background: #F8FAFF;
    }

    .item-thumb-box {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-xs);
      object-fit: cover;
      flex-shrink: 0;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
    }

    .item-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .item-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-item-insert {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: var(--radius-xs);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-item-insert:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    .badge-inserted {
      font-size: 10px;
      font-weight: 600;
      color: var(--success);
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      padding: 2px 6px;
      border-radius: var(--radius-xs);
    }

    /* Bottom Action Bar */
    .footer {
      padding: 10px 14px 12px 14px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary-gradient);
      border: none;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 14px;
      border-radius: var(--radius-xs);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--shadow-primary);
      transition: all 0.15s ease;
    }
    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.05);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
    }
    .btn-primary:active:not(:disabled) {
      transform: scale(0.98);
    }
    .btn-primary:disabled {
      background: #E2E8F0;
      color: #94A3B8;
      box-shadow: none;
      cursor: not-allowed;
    }

    .footer-subrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
      padding: 0 2px;
    }

    .link-sub {
      cursor: pointer;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: color 0.15s;
    }
    .link-sub:hover {
      color: var(--primary);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 64px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(15, 23, 42, 0.94);
      color: #FFFFFF;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* SVG Icon Helper */
    .icon {
      width: 14px;
      height: 14px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: inline-block;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="brand">
      <div class="logo-badge">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      </div>
      <span class="brand-text">Dumpy</span>
    </div>
    
    <div class="header-actions">
      <div class="status-pill" id="statusPill" title="Live Supabase sync active">
        <span class="status-dot"></span>
        <span id="statusText">Live (1.5s)</span>
      </div>
    </div>
  </header>

  <!-- Main Scrollable Surface -->
  <main class="main-content">

    <!-- 1. Centered Device Pairing Surface -->
    <div class="pairing-surface">
      <div class="qr-frame" id="qrContainer" title="Scan with phone camera to beam screenshots"></div>
      
      <div class="room-code-group">
        <div class="room-code-badge" id="roomCodeDisplay" title="Tap to copy Room Code">
          <span id="roomCodeText">DMP-........</span>
          <svg class="icon copy-icon" viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
        </div>
        <button class="icon-btn-subtle" id="btnNewRoom" title="Generate New Room Code">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
          </svg>
        </button>
      </div>

      <p class="pairing-caption">Scan with your phone to beam screenshots directly to this canvas.</p>
    </div>

    <!-- 2. Destination Figma Section Selector (Surface Level) -->
    <div class="section-surface-row">
      <div class="surface-label">
        <span>Target Section</span>
        <span class="link-sub" id="btnRefreshSections" title="Refresh Page Sections">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 11-.57-8.38l5.67-5.67"/>
          </svg>
          Refresh
        </span>
      </div>

      <div class="select-wrapper">
        <select class="custom-select" id="sectionSelect">
          <option value="__NEW__">➕ Create New Section...</option>
          <option value="__FREE__">📌 Free Canvas (No Section)</option>
        </select>
        <svg class="icon select-chevron" viewBox="0 0 24 24">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>

      <div class="new-section-row active" id="newSectionInputRow">
        <input type="text" class="text-input" id="newSectionNameInput" placeholder="Section Name" value="Mobile Screenshots" />
      </div>
    </div>

    <!-- 3. Live Inbox Section (Surface Level) -->
    <div class="inbox-surface-section">
      <div class="inbox-header-row">
        <div class="inbox-title-group">
          <span class="inbox-heading">Inbox</span>
          <span class="count-pill" id="itemCountPill">0</span>
        </div>
        <div class="inbox-controls">
          <label class="checkbox-label" id="selectAllLabel">
            <input type="checkbox" class="checkbox-custom" id="selectAllCheckbox" checked>
            <span>Select All</span>
          </label>
          <button class="icon-btn" id="btnClearInbox" title="Clear Inserted Screenshots">
            <svg class="icon" viewBox="0 0 24 24">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Screenshots List -->
      <div class="inbox-list" id="inboxList">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon-wrap">
            <svg class="icon" style="width: 18px; height: 18px;" viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <div class="empty-text">Inbox is empty</div>
          <p class="empty-sub">Snap or select screenshots on your phone to see them appear live.</p>
        </div>
      </div>
    </div>

  </main>

  <!-- Bottom Insert Actions -->
  <footer class="footer">
    <button class="btn-primary" id="btnInsertBatch" disabled>
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      <span id="btnInsertText">Insert Selected (0)</span>
    </button>
    <div class="footer-subrow">
      <span>Auto-polling (1.5s)</span>
      <span class="link-sub" id="btnManualRefresh">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M23 4v6h-6M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
        Sync Now
      </span>
    </div>
  </footer>

  <!-- Toast Notification -->
  <div class="toast" id="toastMessage">
    <svg class="icon" viewBox="0 0 24 24" style="color: #60A5FA;">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    <span id="toastText">Room Code copied!</span>
  </div>

      var count = qr.getModuleCount();
      var total = count + margin * 2;
      var pathData = "";
      for (var r = 0; r < count; r++) {
        for (var c = 0; c < count; c++) {
          if (qr.isDark(r, c)) {
            pathData += "M" + (c + margin) + "," + (r + margin) + "h1v1h-1z ";
          }
        }
      }
      return "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 " + total + " " + total + "\" width=\"" + size + "\" height=\"" + size + "\" shape-rendering=\"crispEdges\"><rect width=\"100%\" height=\"100%\" fill=\"#FFFFFF\"/><path fill=\"#0F172A\" d=\"" + pathData + "\"/></svg>";
    };
  </script>

  <!-- Main Controller Logic -->
  <script>
    // Safe Storage helper
    const safeStorage = {
      getItem: function(key) {
        try { return window.localStorage ? window.localStorage.getItem(key) : null; } catch(e) { return null; }
      },
      setItem: function(key, val) {
        try { if (window.localStorage) window.localStorage.setItem(key, val); } catch(e) {}
      },
      removeItem: function(key) {
        try { if (window.localStorage) window.localStorage.removeItem(key); } catch(e) {}
      }
    };

    function generateSecureRoomId() {
      const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
      let code = '';
      for (let i = 0; i < 8; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return 'DMP-' + code; // e.g. DMP-7K9X2M4P
    }

    // Always generate a fresh unique cryptographic room ID on every plugin launch
    const initialRoom = generateSecureRoomId();

    // Production Credentials
    const state = {
      roomId: initialRoom,
      supabaseUrl: 'https://nivrnksfmkskmjdjzvzb.supabase.co',
      supabaseKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pdnJua3NmbWtza21qZGp6dnpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxODA1NzMsImV4cCI6MjEwNTc1NjU3M30.UycIKgNMXCtoMVkrqfEbia5g2o_c6edwp1iwtIcTIO4',
      webAppUrl: 'https://dumpy-figma-plugin.vercel.app',
      pollIntervalId: null,
      pollFreqMs: 1500,
      inboxItems: [],
      selectedIds: new Set(),
      sections: [],
      selectedSectionId: '__NEW__',
      isInserting: false,
      knownItemIds: new Set()
    };

    const el = {
      qrContainer: document.getElementById('qrContainer'),
      roomCodeDisplay: document.getElementById('roomCodeDisplay'),
      roomCodeText: document.getElementById('roomCodeText'),
      btnNewRoom: document.getElementById('btnNewRoom'),
      
      sectionSelect: document.getElementById('sectionSelect'),
      newSectionInputRow: document.getElementById('newSectionInputRow'),
      newSectionNameInput: document.getElementById('newSectionNameInput'),
      btnRefreshSections: document.getElementById('btnRefreshSections'),
      
      statusPill: document.getElementById('statusPill'),
      statusText: document.getElementById('statusText'),
      itemCountPill: document.getElementById('itemCountPill'),
      selectAllCheckbox: document.getElementById('selectAllCheckbox'),
      btnClearInbox: document.getElementById('btnClearInbox'),
      inboxList: document.getElementById('inboxList'),
      emptyState: document.getElementById('emptyState'),
      
      btnInsertBatch: document.getElementById('btnInsertBatch'),
      btnInsertText: document.getElementById('btnInsertText'),
      btnManualRefresh: document.getElementById('btnManualRefresh'),
      
      toastMessage: document.getElementById('toastMessage'),
      toastText: document.getElementById('toastText')
    };

    function showToast(msg, duration = 2400) {
      el.toastText.textContent = msg;
      el.toastMessage.classList.add('show');
      setTimeout(() => el.toastMessage.classList.remove('show'), duration);
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    // Render QR Code as crisp Vector SVG
    function updatePairingUI() {
      el.roomCodeText.textContent = state.roomId;
      const pairingUrl = `${state.webAppUrl}/web/index.html?room=${encodeURIComponent(state.roomId)}`;

      try {
        const svgMarkup = window.generateVectorQRCode(pairingUrl, 126, 3);
        el.qrContainer.innerHTML = svgMarkup;
      } catch (e) {
        console.warn("Vector SVG generation fallback:", e);
        el.qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=126x126&data=${encodeURIComponent(pairingUrl)}&color=0F172A" alt="QR" />`;
      }
    }

    function updateSectionSelect() {
      const select = el.sectionSelect;
      const currentVal = select.value;
      
      select.innerHTML = `
        <option value="__NEW__">➕ Create New Section...</option>
        <option value="__FREE__">📌 Free Canvas (No Section)</option>
      `;

      if (state.sections && state.sections.length > 0) {
        const optGroup = document.createElement('optgroup');
        optGroup.label = 'Existing Figma Sections';
        state.sections.forEach(sec => {
          const opt = document.createElement('option');
          opt.value = sec.id;
          opt.textContent = `📁 ${sec.name}`;
          optGroup.appendChild(opt);
        });
        select.appendChild(optGroup);
      }

      const hasPrevVal = Array.from(select.options).some(o => o.value === currentVal);
      if (hasPrevVal) {
        select.value = currentVal;
      } else {
        select.value = '__NEW__';
      }

      el.newSectionInputRow.classList.toggle('active', select.value === '__NEW__');
    }

    // Polling live screenshots from Supabase
    async function pollInbox() {
      if (!state.supabaseUrl || !state.supabaseKey || !state.roomId) return;

      try {
        const queryUrl = `${state.supabaseUrl}/rest/v1/dumpy_screenshots?room_id=eq.${encodeURIComponent(state.roomId)}&order=created_at.desc&limit=50`;

        const res = await fetch(queryUrl, {
          headers: {
            'apikey': state.supabaseKey,
            'Authorization': `Bearer ${state.supabaseKey}`,
            'Range': '0-49'
          }
        });

        if (!res.ok) {
          el.statusPill.style.borderColor = 'var(--danger-border)';
          el.statusPill.style.background = 'var(--danger-bg)';
          el.statusText.textContent = 'Connection Error';
          return;
        }

        el.statusPill.style.borderColor = 'var(--success-border)';
        el.statusPill.style.background = 'var(--success-bg)';
        el.statusText.textContent = 'Live (1.5s)';

        const items = await res.json();
        handleNewInboxItems(items || []);

      } catch (err) {
        console.warn("Poll error:", err);
      }
    }

    function handleNewInboxItems(items) {
      state.inboxItems = items;
      el.itemCountPill.textContent = items.length;

      let newlyDiscoveredCount = 0;
      items.forEach(item => {
        if (!state.knownItemIds.has(item.id)) {
          state.knownItemIds.add(item.id);
          newlyDiscoveredCount++;
          if (!item.is_inserted) {
            state.selectedIds.add(item.id);
          }
        }
      });

      if (newlyDiscoveredCount > 0) {
        showToast(`📸 ${newlyDiscoveredCount} new screenshot(s) beamed!`);
      }

      renderInboxList();
      updateInsertButton();
    }

    function renderInboxList() {
      const items = state.inboxItems;

      if (!items || items.length === 0) {
        el.emptyState.style.display = 'flex';
        el.inboxList.innerHTML = '';
        el.inboxList.appendChild(el.emptyState);
        return;
      }

      el.emptyState.style.display = 'none';
      el.inboxList.innerHTML = '';

      items.forEach(item => {
        const row = document.createElement('div');
        row.className = `item-row ${state.selectedIds.has(item.id) ? 'selected' : ''}`;
        row.id = `item-${item.id}`;

        const isChecked = state.selectedIds.has(item.id);
        const timeAgo = getTimeAgo(new Date(item.created_at));
        const sizeFormatted = formatBytes(item.file_size || 0);

        row.innerHTML = `
          <input type="checkbox" class="checkbox-custom item-checkbox" data-id="${item.id}" ${isChecked ? 'checked' : ''} />
          <img src="${item.file_url}" class="item-thumb-box" alt="Thumbnail" loading="lazy" />
          <div class="item-details">
            <span class="item-name" title="${item.file_name}">${item.file_name}</span>
            <span class="item-meta">
              <span>${timeAgo}</span>
              <span>•</span>
              <span>${sizeFormatted}</span>
            </span>
          </div>
          <div class="item-actions">
            ${item.is_inserted 
              ? `<span class="badge-inserted">✓ Placed</span>` 
              : `<button class="btn-item-insert" data-single-id="${item.id}">Insert</button>`}
          </div>
        `;

        el.inboxList.appendChild(row);
      });

      // Bind item checkbox events
      el.inboxList.querySelectorAll('.item-checkbox').forEach(cb => {
        cb.addEventListener('change', (e) => {
          const id = e.target.getAttribute('data-id');
          if (e.target.checked) {
            state.selectedIds.add(id);
          } else {
            state.selectedIds.delete(id);
          }
          const parentRow = document.getElementById(`item-${id}`);
          if (parentRow) parentRow.classList.toggle('selected', e.target.checked);
          updateInsertButton();
        });
      });

      // Bind single item insert buttons
      el.inboxList.querySelectorAll('[data-single-id]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.getAttribute('data-single-id');
          insertSingleScreenshot(id);
        });
      });
    }

    function getTimeAgo(date) {
      const sec = Math.floor((new Date() - date) / 1000);
      if (sec < 5) return 'just now';
      if (sec < 60) return `${sec}s ago`;
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min}m ago`;
      const hr = Math.floor(min / 60);
      return `${hr}h ago`;
    }

    function updateInsertButton() {
      const count = state.selectedIds.size;
      el.btnInsertBatch.disabled = count === 0 || state.isInserting;
      el.btnInsertText.textContent = state.isInserting 
        ? 'Beaming to Canvas...' 
        : `Insert Selected (${count})`;
      
      const unplacedItems = state.inboxItems.filter(it => !it.is_inserted);
      el.selectAllCheckbox.checked = unplacedItems.length > 0 && unplacedItems.every(it => state.selectedIds.has(it.id));
    }

    // Downscale oversized captures (>4096px) to prevent Figma canvas texture crash
    async function fetchAndDownscaleImageBytes(imageUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const MAX_DIM = 4096;
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;

          if (w > MAX_DIM || h > MAX_DIM) {
            if (w > h) {
              h = Math.round((h * MAX_DIM) / w);
              w = MAX_DIM;
            } else {
              w = Math.round((w * MAX_DIM) / h);
              h = MAX_DIM;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          canvas.toBlob((blob) => {
            if (!blob) {
              reject(new Error("Failed to create blob from image"));
              return;
            }
            const reader = new FileReader();
            reader.onloadend = () => {
              resolve({
                bytes: new Uint8Array(reader.result),
                width: w,
                height: h
              });
            };
            reader.onerror = reject;
            reader.readAsArrayBuffer(blob);
          }, 'image/png');
        };
        img.onerror = () => reject(new Error("Failed to load image from public URL"));
        img.src = imageUrl;
      });
    }

    async function insertSingleScreenshot(id) {
      const item = state.inboxItems.find(it => it.id === id);
      if (!item) return;

      try {
        showToast(`Placing "${item.file_name}"...`);
        const { bytes, width, height } = await fetchAndDownscaleImageBytes(item.file_url);

        const targetSection = el.sectionSelect.value;
        const sectionId = (targetSection !== '__NEW__' && targetSection !== '__FREE__') ? targetSection : null;

        parent.postMessage({
          pluginMessage: {
            type: "INSERT_SINGLE_IMAGE",
            id: item.id,
            name: item.file_name,
            bytes: bytes,
            width: width,
            height: height,
            sectionId: sectionId
          }
        }, '*');

        markItemsAsInserted([item.id]);

      } catch (err) {
        console.error("Single insert error:", err);
        showToast(`Insert failed: ${err.message}`);
      }
    }

    async function insertBatchScreenshots() {
      const selectedList = state.inboxItems.filter(it => state.selectedIds.has(it.id));
      if (selectedList.length === 0) return;

      state.isInserting = true;
      updateInsertButton();
      showToast(`⚡ Placing ${selectedList.length} screenshots into Figma...`);

      try {
        const preparedItems = [];
        for (const item of selectedList) {
          try {
            const { bytes, width, height } = await fetchAndDownscaleImageBytes(item.file_url);
            preparedItems.push({
              id: item.id,
              name: item.file_name,
              bytes: bytes,
              width: width,
              height: height
            });
          } catch (e) {
            console.warn(`Failed to process ${item.file_name}:`, e);
          }
        }

        if (preparedItems.length === 0) {
          throw new Error("Could not download selected images");
        }

        const selectVal = el.sectionSelect.value;
        let sectionId = null;
        let newSectionName = null;

        if (selectVal === '__NEW__') {
          newSectionName = el.newSectionNameInput.value.trim() || `Screenshots (${state.roomId})`;
        } else if (selectVal !== '__FREE__') {
          sectionId = selectVal;
        }

        parent.postMessage({
          pluginMessage: {
            type: "INSERT_BATCH",
            items: preparedItems,
            sectionId: sectionId,
            newSectionName: newSectionName,
            columns: Math.min(Math.max(preparedItems.length <= 2 ? preparedItems.length : 3, 1), 5)
          }
        }, '*');

        markItemsAsInserted(preparedItems.map(p => p.id));
        state.selectedIds.clear();

      } catch (err) {
        console.error("Batch insert failed:", err);
        showToast(`Batch insert error: ${err.message}`);
      } finally {
        state.isInserting = false;
        updateInsertButton();
      }
    }

    async function markItemsAsInserted(ids) {
      if (!ids || ids.length === 0) return;
      try {
        const updateUrl = `${state.supabaseUrl}/rest/v1/dumpy_screenshots?id=in.(${ids.join(',')})`;
        await fetch(updateUrl, {
          method: 'PATCH',
          headers: {
            'apikey': state.supabaseKey,
            'Authorization': `Bearer ${state.supabaseKey}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ is_inserted: true })
        });
      } catch (e) {
        console.warn("Status sync error:", e);
      }
    }

    function clearInsertedFromInbox() {
      const inserted = state.inboxItems.filter(it => it.is_inserted);
      if (inserted.length === 0) {
        showToast("No placed screenshots to clear");
        return;
      }
      state.inboxItems = state.inboxItems.filter(it => !it.is_inserted);
      renderInboxList();
      updateInsertButton();
      showToast(`Cleared ${inserted.length} placed items`);
    }

    // Event Listeners
    el.roomCodeDisplay.addEventListener('click', () => {
      const pairingUrl = `${state.webAppUrl}/web/index.html?room=${encodeURIComponent(state.roomId)}`;
      navigator.clipboard.writeText(state.roomId).then(() => {
        showToast(`📋 Copied Room ${state.roomId}!`);
      }).catch(() => {
        showToast(`Room: ${state.roomId}`);
      });
    });

    el.btnNewRoom.addEventListener('click', () => {
      state.roomId = generateSecureRoomId();
      safeStorage.setItem('dumpy_room_id', state.roomId);
      state.knownItemIds.clear();
      state.selectedIds.clear();
      state.inboxItems = [];
      updatePairingUI();
      renderInboxList();
      updateInsertButton();
      showToast(`✨ Generated Room ${state.roomId}`);
      
      parent.postMessage({
        pluginMessage: { type: "SAVE_STORAGE", key: "dumpy_room_id", value: state.roomId }
      }, '*');

      pollInbox();
    });

    el.sectionSelect.addEventListener('change', () => {
      const val = el.sectionSelect.value;
      el.newSectionInputRow.classList.toggle('active', val === '__NEW__');
      if (val !== '__NEW__' && val !== '__FREE__') {
        parent.postMessage({
          pluginMessage: { type: "SAVE_STORAGE", key: "dumpy_preferred_section_id", value: val }
        }, '*');
      }
    });

    el.btnRefreshSections.addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: "GET_SECTIONS" } }, '*');
      showToast("Refreshed sections");
    });

    el.selectAllCheckbox.addEventListener('change', (e) => {
      if (e.target.checked) {
        state.inboxItems.filter(it => !it.is_inserted).forEach(it => state.selectedIds.add(it.id));
      } else {
        state.selectedIds.clear();
      }
      renderInboxList();
      updateInsertButton();
    });

    el.btnClearInbox.addEventListener('click', clearInsertedFromInbox);
    el.btnInsertBatch.addEventListener('click', insertBatchScreenshots);
    el.btnManualRefresh.addEventListener('click', () => {
      pollInbox();
      showToast("Inbox synchronized");
    });

    // Handle messages from Figma Sandbox (code.js)
    window.onmessage = (event) => {
      const msg = event.data ? event.data.pluginMessage : null;
      if (!msg) return;

      switch (msg.type) {
        case "INIT_RESPONSE":
          state.sections = msg.sections || [];

          if (msg.savedSectionId) {
            state.selectedSectionId = msg.savedSectionId;
          }

          updatePairingUI();
          updateSectionSelect();
          startPolling();
          break;

        case "SECTIONS_LIST":
          state.sections = msg.sections || [];
          updateSectionSelect();
          break;

        case "SECTION_CREATED":
          state.sections = msg.sections || [];
          state.selectedSectionId = msg.sectionId;
          updateSectionSelect();
          el.sectionSelect.value = msg.sectionId;
          el.newSectionInputRow.classList.remove('active');
          break;

        case "IMAGE_INSERTED":
          markItemsAsInserted([msg.id]);
          break;

        case "BATCH_INSERTED":
          if (msg.insertedIds) {
            markItemsAsInserted(msg.insertedIds);
          }
          break;
      }
    };

    function startPolling() {
      if (state.pollIntervalId) clearInterval(state.pollIntervalId);
      pollInbox();
      state.pollIntervalId = setInterval(pollInbox, state.pollFreqMs);
    }

    // Boot
    try {
      updatePairingUI();
      updateSectionSelect();
      startPolling();
      parent.postMessage({ pluginMessage: { type: "INIT" } }, '*');
    } catch (e) {
      console.error("Boot error:", e);
    }
  </script>
